name: placement-foundation

x-api-environment: &api-environment
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-placement}:${POSTGRES_PASSWORD:?Run make configure}@postgres:5432/${POSTGRES_DB:-placement}
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  JWT_SECRET: ${JWT_SECRET:?Run make configure}
  JWT_ISSUER: ${JWT_ISSUER:-placement-api}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-placement-web}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-placement}
      POSTGRES_USER: ${POSTGRES_USER:-placement}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make configure}
    security_opt: [no-new-privileges:true]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    security_opt: [no-new-privileges:true]
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  qdrant:
    image: qdrant/qdrant:v1.17.0
    security_opt: [no-new-privileges:true]
    volumes: [qdrant_data:/qdrant/storage]
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment: *api-environment
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 15
    security_opt: [no-new-privileges:true]
  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    command: [python, -m, app.worker]
    environment: *api-environment
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import os, redis; assert redis.Redis.from_url(os.environ['REDIS_URL'], socket_timeout=2).exists('placement:worker:heartbeat')"]
      interval: 10s
      timeout: 4s
      retries: 10
    security_opt: [no-new-privileges:true]
  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 15
    security_opt: [no-new-privileges:true]
  nginx:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    ports: ["127.0.0.1:${HTTP_PORT:-8080}:8080"]
    volumes: [./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on:
      backend: {condition: service_healthy}
      frontend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health]
      interval: 10s
      timeout: 4s
      retries: 10
    security_opt: [no-new-privileges:true]

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
